name: Publish serverpod_argon2

# Same trigger and OIDC publishing as dart-lang/setup-dart's reusable
# publish.yml, which the other Serverpod packages use. That workflow cannot
# run a build first, and this package must ship the prebuilt libraries in
# binary/.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*" # Matches tags like v1.2.3 and v1.2.3-pre.1

jobs:
  build:
    name: Build prebuilt libraries
    # macOS, because the iOS targets need Xcode. Every other target
    # cross-compiles.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
      - uses: dart-lang/setup-dart@v1.7.1
      - run: dart pub get
      - run: dart run tool/build_binaries.dart
      - name: Check the committed wasm module is current
        run: |
          git diff --exit-code lib/src/module/argon2_wasm.g.dart || {
            echo "::error::lib/src/module/argon2_wasm.g.dart is stale. Run dart run tool/build_binaries.dart and commit it."
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: binary
          path: binary/
          if-no-files-found: error

  # Loads the prebuilt library, not a source build, on each desktop OS.
  smoke_test:
    name: Test prebuilt library (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: binary
          path: binary/
      - uses: dart-lang/setup-dart@v1.7.1
      - run: dart pub get
      # Without the zig build files the hook cannot fall back to a source
      # build, so a missing or broken prebuilt fails the tests.
      - run: rm build.zig build.zig.zon
        shell: bash
      - run: dart test -p vm

  publish:
    name: Publish to pub.dev
    needs: smoke_test
    permissions:
      id-token: write # Required for pub.dev automated publishing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: binary
          path: binary/
      # Provisions the OIDC token dart pub publish uses.
      - uses: dart-lang/setup-dart@v1.7.1
      - run: dart pub get
      - run: dart pub publish --dry-run
      - run: dart pub publish --force
