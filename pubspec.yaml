name: serverpod_argon2
description: >-
  Argon2 password hashing (argon2id, argon2i, argon2d) backed by the Zig
  standard library. Ships prebuilt native libraries for Dart and Flutter and a
  WebAssembly module for the web, so no local toolchain is needed.
version: 0.1.0
repository: https://github.com/serverpod/serverpod_argon2
homepage: https://serverpod.dev
issue_tracker: https://github.com/serverpod/serverpod_argon2/issues

topics:
  - argon2
  - password
  - hashing
  - cryptography

environment:
  sdk: ^3.10.0

dependencies:
  code_assets: '>=1.2.1 <3.0.0'
  hooks: ^2.0.0

dev_dependencies:
  serverpod_lints: '>=2.7.0'
  test: ^1.25.6
